# netlify.toml
[[redirects]]
  from = "/*"
  to = "https://www.lpe.de/:splat"
  status = 301
  force = true
  conditions = { Host = ["lpe.de"] }   # nur non-www Host matchen

# (Optional) Doppel-Slash-Härter, wenn du es brauchst:
# Achtung: NICHT für Dateien wie robots.txt/sitemap.xml nötig
# [[redirects]]
#   from = "/*//"
#   to = "/:splat/"
#   status = 301
#   force = true
