# netlify.toml

[[redirects]]
  from = "/sitemap.xml"
  to   = "/sitemap-index.xml"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://www.lpe.de/:splat"
  status = 301
  force = true
  conditions = { Host = ["lpe.de"] }   # nur non-www Host matchen

# (Optional) Doppel-Slash-Härter, wenn du es brauchst:
# Achtung: NICHT für Dateien wie robots.txt/sitemap.xml nötig
# [[redirects]]
#   from = "/*//"
#   to = "/:splat/"
#   status = 301
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
