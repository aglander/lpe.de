name: Read ProvenExpert
on:
  schedule:
    - cron: '0 0 * * *' # once per day at midnight UTC

jobs:
  ReadProvenExpert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Call ProvenExpert and store response in file
        env:
          PROVENEXPERT_API_KEY: ${{ secrets.PROVENEXPERT_API_KEY }}
        run: |
          curl -u "$PROVENEXPERT_API_KEY" \
            https://www.provenexpert.com/api_rating_v2.json \
            > src/data/provenexpert.json

      - name: Commit changes
        uses: EndBug/add-and-commit@v7
        with:
          author_name: Arian glander
          author_email: glander@me.com
          message: 'Updating provenexpert rating'
          add: 'src/data/provenexpert.json'
